---
- name: Provision Docker host
  hosts: app
  become: true
  gather_facts: true

  vars:
    docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
    docker_apt_key_path: /etc/apt/keyrings/docker.asc
    docker_apt_repo_path: /etc/apt/sources.list.d/docker.list
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    base_packages:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw

  pre_tasks:
    - name: Ensure Ubuntu target
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
        fail_msg: "This playbook currently supports Ubuntu hosts only."

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker apt key
      ansible.builtin.get_url:
        url: "{{ docker_apt_key_url }}"
        dest: "{{ docker_apt_key_path }}"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Configure Docker apt repository
      ansible.builtin.copy:
        dest: "{{ docker_apt_repo_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [arch={{ ansible_facts["architecture"] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by={{ docker_apt_key_path }}] https://download.docker.com/linux/ubuntu {{ ansible_facts["distribution_release"] }} stable
      register: docker_repo

    - name: Update apt cache after Docker repository change
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo.changed

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Allow app user to run Docker without sudo
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Check UFW verbose status before default policies
      ansible.builtin.command: ufw status verbose
      register: ufw_verbose_status
      changed_when: false

    - name: Set default UFW incoming policy
      ansible.builtin.command: ufw default deny incoming
      when: "'deny (incoming)' not in ufw_verbose_status.stdout"

    - name: Set default UFW outgoing policy
      ansible.builtin.command: ufw default allow outgoing
      when: "'allow (outgoing)' not in ufw_verbose_status.stdout"

    - name: Allow required TCP ports
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      loop: "{{ firewall_allowed_tcp_ports }}"
      register: ufw_allow
      changed_when: "'Rule added' in ufw_allow.stdout"

    - name: Check UFW status before removing legacy public ports
      ansible.builtin.command: ufw status
      register: ufw_status_before_cleanup
      changed_when: false

    - name: Remove legacy public TCP ports
      ansible.builtin.command: "ufw delete allow {{ item }}/tcp"
      loop: "{{ firewall_denied_tcp_ports | default([]) }}"
      register: ufw_delete_legacy
      changed_when: "'Rule deleted' in ufw_delete_legacy.stdout"
      when: (item ~ "/tcp") in ufw_status_before_cleanup.stdout

    - name: Check UFW status before enabling
      ansible.builtin.command: ufw status
      register: ufw_status_before_enable
      changed_when: false

    - name: Enable UFW
      ansible.builtin.command: ufw --force enable
      when: "'inactive' in ufw_status_before_enable.stdout"

  post_tasks:
    - name: Show Docker versions
      ansible.builtin.command: docker version --format 'Client={{ "{{" }}.Client.Version{{ "}}" }} Server={{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_version
      changed_when: false

    - name: Show Docker Compose version
      ansible.builtin.command: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show firewall status
      ansible.builtin.command: ufw status numbered
      register: ufw_status
      changed_when: false

    - name: Print provisioned state
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ docker_compose_version.stdout }}"
          - "{{ ufw_status.stdout_lines }}"
