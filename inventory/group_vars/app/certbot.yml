---
certbot_install_method: package
certbot_create_if_missing: true
certbot_create_method: webroot
certbot_admin_email: "{{ app_letsencrypt_email }}"
certbot_auto_renew: true
certbot_auto_renew_user: root
certbot_auto_renew_hour: "3"
certbot_auto_renew_minute: "30"
certbot_auto_renew_options: >-
  --quiet
  --deploy-hook '/usr/bin/docker compose -f {{ app_root_dir }}/compose.yml exec -T nginx nginx -s reload'
certbot_certs:
  - name: "{{ app_nginx_server_name }}"
    webroot: "{{ app_letsencrypt_webroot_dir }}"
    domains:
      - "{{ app_nginx_server_name }}"
    deploy_hook: "/usr/bin/docker compose -f {{ app_root_dir }}/compose.yml exec -T nginx nginx -s reload"
certbot_create_command: >-
  {{ certbot_script }} certonly --webroot
  --webroot-path {{ cert_item.webroot | default(certbot_webroot) }}
  --noninteractive --agree-tos
  {% if app_letsencrypt_email | length > 0 %}
  --email {{ app_letsencrypt_email }} --no-eff-email
  {% else %}
  --register-unsafely-without-email
  {% endif %}
  --cert-name {{ cert_item_name }}
  -d {{ cert_item.domains | join(',') }}
  {{ "--deploy-hook '" ~ cert_item.deploy_hook ~ "'" if 'deploy_hook' in cert_item else '' }}
