---
- name: Ensure application directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - path: "{{ app_root_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ app_data_dir }}"
      owner: "{{ app_container_uid }}"
      group: "{{ app_container_gid }}"
      mode: "0770"
    - path: "{{ app_logs_dir }}"
      owner: "{{ app_container_uid }}"
      group: "{{ app_container_gid }}"
      mode: "0770"
    - path: "{{ app_nginx_conf_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ app_nginx_cache_dir }}"
      owner: "{{ app_nginx_uid }}"
      group: "{{ app_nginx_gid }}"
      mode: "0770"
    - path: "{{ app_letsencrypt_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ app_letsencrypt_webroot_dir }}"
      owner: root
      group: root
      mode: "0755"

- name: Validate managed database host
  ansible.builtin.assert:
    that:
      - app_db_host | length > 0
    fail_msg: "Set vault_postgres_host in encrypted inventory/group_vars/app/vault.yml before deploying."

- name: Validate managed database name
  ansible.builtin.assert:
    that:
      - app_db_name | length > 0
    fail_msg: "Set vault_postgres_database in encrypted inventory/group_vars/app/vault.yml before deploying."

- name: Validate managed database username
  ansible.builtin.assert:
    that:
      - app_db_user | length > 0
    fail_msg: "Set vault_postgres_username in encrypted inventory/group_vars/app/vault.yml before deploying."

- name: Validate managed database password
  ansible.builtin.assert:
    that:
      - app_db_password | length > 0
    fail_msg: "Set vault_postgres_password in encrypted inventory/group_vars/app/vault.yml before deploying."

- name: Validate object storage settings
  ansible.builtin.assert:
    that:
      - app_s3_bucket | length > 0
      - app_s3_region | length > 0
      - app_s3_endpoint | length > 0
      - app_s3_access_key | length > 0
      - app_s3_secret_key | length > 0
    fail_msg: >-
      Set vault_s3_bucket, vault_s3_region, vault_s3_endpoint,
      vault_s3_access_key, and vault_s3_secret_key in encrypted
      inventory/group_vars/app/vault.yml before deploying with the prod profile.
  when: "'prod' in ((app_spring_profiles | string).split(',') | map('trim') | list)"

- name: Copy Yandex Cloud PostgreSQL CA certificate
  ansible.builtin.copy:
    src: root.crt
    dest: "{{ app_db_ca_cert_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Check existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "{{ app_letsencrypt_cert_path }}"
  register: letsencrypt_certificate

- name: Render Docker Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_root_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  register: docker_compose_file

- name: Render Let's Encrypt renewal service
  ansible.builtin.template:
    src: certbot-renew.service.j2
    dest: "/etc/systemd/system/{{ app_letsencrypt_renew_service }}"
    owner: root
    group: root
    mode: "0644"

- name: Render Let's Encrypt renewal timer
  ansible.builtin.template:
    src: certbot-renew.timer.j2
    dest: "/etc/systemd/system/{{ app_letsencrypt_renew_timer }}"
    owner: root
    group: root
    mode: "0644"

- name: Render Nginx reverse proxy config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ app_nginx_conf_dir }}/default.conf"
    owner: root
    group: root
    mode: "0644"
  register: nginx_config_initial

- name: Render application environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_root_dir }}/app.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Log in to container registry when credentials are configured
  ansible.builtin.command:
    argv:
      - docker
      - login
      - ghcr.io
      - --username
      - "{{ app_registry_username }}"
      - --password-stdin
    stdin: "{{ app_registry_password }}"
  register: docker_login
  changed_when: "'Login Succeeded' in docker_login.stdout"
  no_log: true
  when:
    - app_registry_username | length > 0
    - app_registry_password | length > 0

- name: Pull application image
  ansible.builtin.command:
    cmd: docker compose -f {{ app_root_dir }}/compose.yml pull app migrate nginx certbot
  register: docker_pull
  changed_when: "'Downloaded newer image' in docker_pull.stdout or 'Pull complete' in docker_pull.stdout"

- name: Pull database client image
  ansible.builtin.command:
    cmd: docker pull {{ app_db_client_image }}
  register: docker_db_client_pull
  changed_when: "'Downloaded newer image' in docker_db_client_pull.stdout or 'Pull complete' in docker_db_client_pull.stdout"

- name: Pull object storage client image
  ansible.builtin.command:
    cmd: docker pull {{ app_s3_client_image }}
  register: docker_s3_client_pull
  changed_when: "'Downloaded newer image' in docker_s3_client_pull.stdout or 'Pull complete' in docker_s3_client_pull.stdout"
  when: "'prod' in ((app_spring_profiles | string).split(',') | map('trim') | list)"

- name: Check object storage write access
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - sh
      - -e
      - AWS_ACCESS_KEY_ID
      - -e
      - AWS_SECRET_ACCESS_KEY
      - "{{ app_s3_client_image }}"
      - -c
      - >-
        touch /tmp/deploy-check
        && aws --endpoint-url {{ app_s3_endpoint }}
        s3api put-object
        --bucket {{ app_s3_bucket }}
        --key {{ app_s3_deploy_check_key }}
        --body /tmp/deploy-check
        --region {{ app_s3_region }}
  environment:
    AWS_ACCESS_KEY_ID: "{{ app_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ app_s3_secret_key }}"
  register: s3_write_access
  changed_when: false
  no_log: true
  when: "'prod' in ((app_spring_profiles | string).split(',') | map('trim') | list)"

- name: Check object storage read access
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -e
      - AWS_ACCESS_KEY_ID
      - -e
      - AWS_SECRET_ACCESS_KEY
      - "{{ app_s3_client_image }}"
      - --endpoint-url
      - "{{ app_s3_endpoint }}"
      - s3api
      - head-object
      - --bucket
      - "{{ app_s3_bucket }}"
      - --key
      - "{{ app_s3_deploy_check_key }}"
      - --region
      - "{{ app_s3_region }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ app_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ app_s3_secret_key }}"
  register: s3_read_access
  changed_when: false
  no_log: true
  when: "'prod' in ((app_spring_profiles | string).split(',') | map('trim') | list)"

- name: Check managed database readiness
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -e
      - PGPASSWORD
      - -v
      - "{{ app_db_ca_cert_path }}:/root/.postgresql/root.crt:ro"
      - "{{ app_db_client_image }}"
      - psql
      - "host={{ app_db_host }} port={{ app_db_port }} dbname={{ app_db_name }} user={{ app_db_user }} sslmode={{ app_db_ssl_mode }} target_session_attrs={{ app_db_target_session_attrs }} sslrootcert=/root/.postgresql/root.crt"
      - -c
      - SELECT 1
  environment:
    PGPASSWORD: "{{ app_db_password }}"
  register: db_readiness
  changed_when: false
  failed_when: false
  retries: 30
  delay: 2
  until: >
    db_readiness.rc == 0
    or 'password authentication failed' in db_readiness.stderr

- name: Fail when managed database is not ready
  ansible.builtin.fail:
    msg: >-
      Managed PostgreSQL readiness check failed for user '{{ app_db_user }}'
      and database '{{ app_db_name }}' at '{{ app_db_host }}:{{ app_db_port }}'.
      Last error: {{ db_readiness.stderr | default(db_readiness.stdout, true) }}
  when: db_readiness.rc != 0

- name: Run database migration step
  ansible.builtin.command:
    cmd: docker compose -f {{ app_root_dir }}/compose.yml --profile migration run --rm migrate
  register: app_migration
  changed_when: false

- name: Start or update application container
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ app_root_dir }}/compose.yml up -d --remove-orphans
      {% if docker_compose_file.changed %}--force-recreate{% endif %}
      app nginx
  register: app_compose_up
  changed_when: "'Started' in app_compose_up.stdout or 'Recreated' in app_compose_up.stdout or 'Created' in app_compose_up.stdout"

- name: Wait for application health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_management_port }}/actuator/health/readiness"
    method: GET
    status_code: 200
  register: app_health
  retries: 30
  delay: 2
  until: app_health.status == 200

- name: Wait for Nginx reverse proxy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_nginx_http_port }}/api/bulletins"
    method: GET
    status_code:
      - 200
      - 301
    follow_redirects: none
  register: nginx_health
  retries: 30
  delay: 2
  until: nginx_health.status in [200, 301]

- name: Issue Let's Encrypt certificate with email
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ app_root_dir }}/compose.yml --profile certbot run --rm certbot
      certonly --webroot --webroot-path /var/www/certbot
      --domain {{ app_nginx_server_name }}
      --email {{ app_letsencrypt_email }}
      --agree-tos --non-interactive --no-eff-email
  register: certbot_issue
  changed_when: true
  when:
    - not letsencrypt_certificate.stat.exists
    - app_letsencrypt_email | length > 0

- name: Issue Let's Encrypt certificate without email
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ app_root_dir }}/compose.yml --profile certbot run --rm certbot
      certonly --webroot --webroot-path /var/www/certbot
      --domain {{ app_nginx_server_name }}
      --agree-tos --non-interactive --register-unsafely-without-email
  register: certbot_issue_without_email
  changed_when: true
  when:
    - not letsencrypt_certificate.stat.exists
    - app_letsencrypt_email | length == 0

- name: Re-check Let's Encrypt certificate after issuance
  ansible.builtin.stat:
    path: "{{ app_letsencrypt_cert_path }}"
  register: letsencrypt_certificate

- name: Render Nginx config with HTTPS when certificate is available
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ app_nginx_conf_dir }}/default.conf"
    owner: root
    group: root
    mode: "0644"
  register: nginx_config_final

- name: Reload Nginx after certificate/config update
  ansible.builtin.command:
    cmd: docker compose -f {{ app_root_dir }}/compose.yml exec -T nginx nginx -s reload
  register: nginx_reload
  changed_when: true
  when:
    - letsencrypt_certificate.stat.exists
    - >
      nginx_config_initial.changed
      or nginx_config_final.changed
      or (certbot_issue is defined and certbot_issue.changed)
      or (certbot_issue_without_email is defined and certbot_issue_without_email.changed)

- name: Enable Let's Encrypt renewal timer
  ansible.builtin.systemd_service:
    name: "{{ app_letsencrypt_renew_timer }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for HTTPS reverse proxy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ app_nginx_https_port }}/api/bulletins"
    method: GET
    status_code: 200
    validate_certs: false
  register: nginx_https_health
  retries: 30
  delay: 2
  until: nginx_https_health.status == 200
  when: letsencrypt_certificate.stat.exists

- name: Show running deployment
  ansible.builtin.command:
    cmd: docker inspect --format {% raw %}'Image={{ .Config.Image }} State={{ .State.Status }} Started={{ .State.StartedAt }}'{% endraw %} {{ app_container_name }}
  register: app_container_state
  changed_when: false

- name: Print deployment state
  ansible.builtin.debug:
    msg: "{{ app_container_state.stdout }}"
  when: app_container_state is not skipped
